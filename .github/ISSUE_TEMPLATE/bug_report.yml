name: Bug report
description: Report a player-visible problem in a supported AGI game.
title: "GAME AREA: symptom"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [issue map](https://github.com/wizardmanannan/CX16Agi/issues/37) for an existing report.
        Start with what the player sees. Code analysis is optional.

  - type: textarea
    id: scene
    attributes:
      label: Scene and symptom
      description: Name the room or sequence, what you were doing, and what went wrong.
    validations:
      required: true

  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - King's Quest I
        - King's Quest II
        - King's Quest III
        - The Black Cauldron
        - Space Quest II
        - Police Quest 1
        - Christmas Card 1986
        - Another AGI 1 or 2 game
    validations:
      required: true

  - type: input
    id: game-version
    attributes:
      label: Game version or build
      description: Give the release and AGI interpreter version if known. Say if either is unknown.
    validations:
      required: true

  - type: input
    id: port-revision
    attributes:
      label: Port revision
      description: Give the exact commit if known. Say whether you ran GitHub main or a PR build.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Emulator, ROM or hardware
      description: Give the emulator and ROM versions, or the hardware and firmware revision, if known.

  - type: textarea
    id: impact
    attributes:
      label: Play impact and workaround
      description: Say whether this blocks progress and how a player can recover, if known.

  - type: textarea
    id: steps
    attributes:
      label: Reproduce it
      description: Give numbered steps from a reachable point with the exact keys or commands, prerequisites and approximate time.
      placeholder: |
        1. Start the game and reach ...
        2. Walk to ...
        3. Type or press ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: Describe what the player should see or be able to do.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Describe what you saw, where it first diverged and how often it happens.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Attach a capture, log or stable rerun command. For source findings, distinguish confirmed facts, suspected causes and checks still to run.

  - type: textarea
    id: original
    attributes:
      label: Reference implementation
      description: If available, give the result for the same release in a reference interpreter or link the spec or reference code.

  - type: textarea
    id: acceptance
    attributes:
      label: How to verify a fix
      description: Describe the observable result that would pass the same reproduction and link related issues or candidate PRs if known.
