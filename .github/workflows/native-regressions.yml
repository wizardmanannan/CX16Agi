name: Native regressions

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC65_SHA: e11fb5c39371046ebe25485f984f644c5a0d65d3
      X16_EMULATOR_SHA: 77f2bab332e24c5456f9844a6c7ddd203f6198e6
      CC65_HOME: ${{ github.workspace }}/obj/ci-tools/cc65
      X16_EMULATOR_SOURCE: ${{ github.workspace }}/obj/ci-tools/x16-emulator
      TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TEST_OUTPUT_ROOT: ${{ github.workspace }}/obj

    steps:
      - name: Check out the event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record tested revision
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/cx16agi-native-evidence"
          actual_sha=$(git rev-parse HEAD)
          if [[ "$actual_sha" != "$TESTED_SHA" ]]; then
            echo "Checked out $actual_sha, expected $TESTED_SHA" >&2
            exit 1
          fi

          mkdir -p "$EVIDENCE_DIR"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            revision_source=pull_request.head.sha
          else
            revision_source=github.sha
          fi
          {
            echo "event=$GITHUB_EVENT_NAME"
            echo "revision_source=$revision_source"
            echo "tested_sha=$actual_sha"
            echo "event_sha=$GITHUB_SHA"
            echo "cc65_sha=$CC65_SHA"
            echo "x16_emulator_sha=$X16_EMULATOR_SHA"
          } > "$EVIDENCE_DIR/revisions.txt"

          {
            echo "### Native regressions"
            echo "- Tested \`$revision_source\`: \`$actual_sha\`"
            echo "- Event SHA: \`$GITHUB_SHA\`"
            echo "- cc65: \`$CC65_SHA\`; x16-emulator CPU: \`$X16_EMULATOR_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build pinned cc65 and fetch emulator CPU
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/cx16agi-native-evidence"
          mkdir -p "$(dirname "$CC65_HOME")"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/cc65/cc65.git "$CC65_HOME"
          git -C "$CC65_HOME" checkout --quiet --detach "$CC65_SHA"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/X16Community/x16-emulator.git "$X16_EMULATOR_SOURCE"
          git -C "$X16_EMULATOR_SOURCE" checkout --quiet --detach "$X16_EMULATOR_SHA"

          if make -C "$CC65_HOME" -j2 all > "$EVIDENCE_DIR/cc65-build.log" 2>&1; then
            echo "Built cc65 at $CC65_SHA"
          else
            build_status=$?
            tail -n 80 "$EVIDENCE_DIR/cc65-build.log" >&2
            exit "$build_status"
          fi

      - name: Install staging test headers
        run: sudo apt-get update && sudo apt-get install -y libpng-dev

      - name: Run shipped build, staging, core and production suites
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/cx16agi-native-evidence"
          export TEST_FIXTURE_ROOT="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP"
          core_status=0
          production_status=0
          build_status=0
          staging_status=0
          evidence_status=0

          run_suite() {
            local label="$1"
            local target="$2"
            local status
            local tee_status
            local -a pipeline_status

            set +e
            make -C tools "$target" 2>&1 | tee "$EVIDENCE_DIR/$label.log"
            pipeline_status=("${PIPESTATUS[@]}")
            set -e
            status="${pipeline_status[0]}"
            tee_status="${pipeline_status[1]}"

            printf '%s=%s\n' "$label" "$status" >> "$EVIDENCE_DIR/results.txt"
            printf -- '- make -C tools %s: exit %s\n' "$target" "$status" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$tee_status" -ne 0 ]]; then
              echo "Could not capture the $label log (tee exit $tee_status)" >&2
              evidence_status=1
            fi
            case "$label" in
              build) build_status="$status" ;;
              staging) staging_status="$status" ;;
              core) core_status="$status" ;;
              production) production_status="$status" ;;
            esac
          }

          run_suite build build-test
          run_suite staging staging-test
          run_suite core test
          run_suite production production-test

          if [[ "$build_status" -ne 0 || "$staging_status" -ne 0 || "$core_status" -ne 0 || "$production_status" -ne 0 || "$evidence_status" -ne 0 ]]; then
            exit 1
          fi

      - name: Upload native CI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-regressions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cx16agi-native-evidence
          if-no-files-found: ignore
          retention-days: 14
