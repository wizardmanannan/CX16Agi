FEATURES {
    STARTADDRESS: default = $0801;
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__, segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__,
            count = __INTERRUPTOR_COUNT__, segment = RODATA,
            import = __CALLIRQ__;
}
SYMBOLS {
    __LOADADDR__: type = import;
    __EXEHDR__: type = import;
    __STACKSIZE__: type = weak, value = $0800;
    __HIMEM__: type = weak, value = $9F00;

    # memoryManager.c keeps resource bank sizes for initialization paths not
    # used by this fixture.
    __BANKRAM01_SIZE__: type = weak, value = 0;
    __BANKRAM02_SIZE__: type = weak, value = 0;
    __BANKRAM03_SIZE__: type = weak, value = 0;
    __BANKRAM04_SIZE__: type = weak, value = 0;
    __BANKRAM05_SIZE__: type = weak, value = 0;
    __BANKRAM07_SIZE__: type = weak, value = 0;
    __BANKRAM08_SIZE__: type = weak, value = 0;
    __BANKRAM09_SIZE__: type = weak, value = 0;
    __BANKRAM0A_SIZE__: type = weak, value = 0;
    __BANKRAM0B_SIZE__: type = weak, value = 0;
    __BANKRAM0C_SIZE__: type = weak, value = 0;
    __BANKRAM0D_SIZE__: type = weak, value = 0;
    __BANKRAM0E_SIZE__: type = weak, value = 0;
    __BANKRAM0F_SIZE__: type = weak, value = 0;
    __BANKRAM11_SIZE__: type = weak, value = 0;
    __BANKRAM12_SIZE__: type = weak, value = 0;
}
MEMORY {
    ZP: file = "", define = yes, start = $0022, size = $0080 - $0022;
    LOADADDR: file = %O, start = %S - 2, size = $0002;
    HEADER: file = %O, define = yes, start = %S, size = $000D;
    MAIN: file = %O, define = yes, start = __HEADER_LAST__,
          size = __HIMEM__ - __HEADER_LAST__ - __STACKSIZE__;
    DEBUGRAM: file = "", define = yes, start = $A000, size = $2000,
              bank = $13;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    EXTZP: load = ZP, type = zp, optional = yes;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR: load = HEADER, type = ro;
    STARTUP: load = MAIN, type = ro, optional = yes;
    LOWCODE: load = MAIN, type = ro, optional = yes;
    CODE: load = MAIN, type = ro;
    RODATA: load = MAIN, type = ro;
    DATA: load = MAIN, type = rw;
    INIT: load = MAIN, type = rw, optional = yes;
    ONCE: load = MAIN, type = ro, define = yes;
    BANKRAM06: load = MAIN, type = ro, optional = yes, define = yes;
    BANKRAM10: load = MAIN, type = rw, optional = yes, define = yes;
    BANKRAMDEBUG: load = DEBUGRAM, type = bss, optional = yes, define = yes;
    RAMINIT: load = MAIN, type = rw, optional = yes, define = yes;
    BSS: load = MAIN, type = bss, define = yes;
}
